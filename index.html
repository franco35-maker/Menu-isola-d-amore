<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Digitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1a1512;
    --gold: #b8935a;
    --gold-dark: #9a7640;
    --wine: #6d2430;
    --parchment: #faf6ee;
    --parchment-dim: #f0e9d8;
    --text: #2a231d;
    --line: rgba(42,35,29,0.14);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background-color: var(--parchment); background-size: cover; background-position: center top; background-attachment: fixed; color: var(--text); font-family:'Lora',Georgia,serif; }
  .display{ font-family:'Playfair Display', Georgia, serif; }

  /* ---------- Header ---------- */
  header{
    position: relative;
    min-height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 3rem 1.5rem;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(26,21,18,0.5), rgba(26,21,18,0.68));
  }
  .header-content{ position:relative; z-index:2; max-width: 480px; }
  #logoImg{ max-width: 84px; max-height: 84px; border-radius: 50%; margin-bottom: 1.1rem; display:none; object-fit:cover; border: 2px solid var(--gold); }
  header h1{ font-size:clamp(2rem,6vw,2.9rem); margin:0; font-weight:500; color: var(--parchment); letter-spacing: 0.02em; }
  .rule{ width: 70px; height:1px; background: var(--gold); margin: 1.1rem auto; opacity:0.85; }
  header .hours{ font-family:'Lora',serif; font-size:0.92rem; color: var(--parchment); opacity:0.85; letter-spacing:0.02em; margin:0; }
  header .address{ font-family:'Lora',serif; font-size:0.82rem; color: var(--parchment); opacity:0.65; margin: 0.3rem 0 0; }

  .social-row{ display:flex; justify-content:center; gap:1rem; margin-top:1.3rem; }
  .social-row a{ color: var(--parchment); opacity:0.8; display:flex; transition: opacity 0.15s ease; }
  .social-row a:hover{ opacity:1; }
  .social-row svg{ width:18px; height:18px; }

  /* ---------- Controls ---------- */
  .controls{ position:sticky; top:0; z-index:30; background: rgba(250,246,238,0.94); padding: 1.2rem 1rem 0.6rem; }
  .search-wrap{ max-width:520px; margin:0 auto 1rem; position:relative; }
  .search-wrap input{
    width:100%; padding:0.55rem 0.2rem 0.55rem 1.7rem; border:none; border-bottom: 1.5px solid var(--line);
    background:transparent; font-family:'Lora',serif; font-style:italic; font-size:0.95rem; color:var(--text); outline:none;
  }
  .search-wrap input:focus{ border-bottom-color: var(--gold-dark); }
  .search-wrap svg{ position:absolute; left:0; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:0.45; }

  .tabs{ max-width:640px; margin:0 auto; display:flex; justify-content:center; gap:1.4rem; flex-wrap:wrap; }
  .tab{
    font-family:'Lora',serif; font-weight:500; padding:0.2rem 0; border:none; background:none; color:var(--text);
    font-size:0.88rem; cursor:pointer; opacity:0.6; border-bottom: 1.5px solid transparent; letter-spacing:0.01em;
  }
  .tab.active{ opacity:1; color: var(--wine); border-bottom-color: var(--gold-dark); }

  /* ---------- Menu body ---------- */
  main{ max-width:680px; margin:0 auto; padding:1.6rem 1.2rem 4rem; min-height: 40vh; background: rgba(250,246,238,0.94); }
  .category-block{ margin-bottom:2.6rem; }
  .category-block h2{
    text-align:center; font-family:'Playfair Display',serif; font-weight:500; font-size:1.4rem; color:var(--ink);
    margin:0 0 1.3rem; letter-spacing:0.03em;
  }

  .dish{
    display:flex; justify-content:space-between; align-items:flex-start; gap:0.8rem; padding:1rem 0;
    border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left; font:inherit; color:inherit;
  }
  .dish:last-child{ border-bottom:none; }
  .dish-thumb{ width:54px; height:54px; border-radius:6px; object-fit:cover; flex-shrink:0; background: var(--parchment-dim); }
  .dish-left{ flex:1; min-width:0; }
  .dish-name{ font-size:1.06rem; font-weight:500; color:var(--ink); }
  .dish-tags{ margin-top:0.35rem; display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center; }
  .badge{ font-family:'Lora',serif; font-style:italic; font-size:0.72rem; color: var(--gold-dark); }
  .allergen-icon{ width:15px; height:15px; opacity:0.55; }
  .dish-price{ font-family:'Lora',serif; font-weight:600; color: var(--wine); white-space:nowrap; font-size:1rem; padding-top:0.1rem; }

  .empty-state{ text-align:center; padding:3rem 1rem; color:var(--text); opacity:0.5; font-family:'Lora',serif; font-style:italic; display:none; }
  .empty-state.show{ display:block; }

  /* ---------- Modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(26,21,18,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .modal-backdrop{ align-items:center; } }
  .modal{
    background: var(--parchment); width:100%; max-width:460px; border-radius:10px 10px 0 0;
    padding:1.9rem 1.7rem 2.2rem; transform:translateY(24px); transition:transform 0.22s ease;
    max-height:86vh; overflow-y:auto; position:relative;
  }
  @media (min-width:640px){ .modal{ border-radius:10px; } }
  .modal-backdrop.open .modal{ transform:translateY(0); }
  .modal-img{ width:100%; max-height:210px; object-fit:cover; border-radius:6px; margin-bottom:1.1rem; display:none; }
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .modal h3{ font-family:'Playfair Display',serif; font-weight:500; font-size:1.4rem; margin:0 0 0.3rem; color:var(--ink); }
  .modal .modal-price{ font-family:'Lora',serif; font-weight:600; font-size:1.1rem; color: var(--wine); white-space:nowrap; }
  .modal-close{ background: var(--parchment-dim); border:none; width:28px; height:28px; border-radius:50%; font-size:0.95rem; cursor:pointer; color:var(--text); position:absolute; top:1.3rem; right:1.3rem; }
  .modal-badges{ margin:0.5rem 0 1rem; display:flex; gap:0.5rem; flex-wrap:wrap; }
  .modal p.desc{ font-size:0.98rem; line-height:1.65; margin:0 0 1rem; }
  .allergen-list{ display:flex; flex-wrap:wrap; gap:0.9rem; border-top:1px solid var(--line); padding-top:1rem; }
  .allergen-list .allergen-item{ display:flex; align-items:center; gap:0.35rem; font-family:'Lora',serif; font-size:0.78rem; opacity:0.75; }
  .allergen-list .allergen-item svg{ width:16px; height:16px; opacity:0.7; }
  .modal .note{ font-family:'Lora',serif; font-style:italic; font-size:0.82rem; color:var(--text); opacity:0.6; margin-top:0.7rem; }

  footer{ text-align:center; padding:2rem 1rem 2.4rem; border-top: 1px solid var(--line); background: rgba(250,246,238,0.94); }
  footer p{ font-family:'Lora',serif; font-size:0.82rem; color: var(--text); opacity:0.55; margin:0; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="header-content">
    <img id="logoImg" alt="Logo">
    <h1 id="restaurantName" class="display">Caricamento...</h1>
    <div class="rule"></div>
    <p class="hours" id="restaurantHours"></p>
    <p class="address" id="restaurantAddress"></p>
    <div class="social-row" id="socialRow"></div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Cerca un piatto..." autocomplete="off">
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<main id="menuContainer"></main>

<div class="empty-state" id="emptyState">Nessun piatto trovato. Prova un'altra ricerca.</div>

<footer><p id="footerInfo"></p></footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalCloseBtn" aria-label="Chiudi">✕</button>
    <img class="modal-img" id="modalImg" alt="">
    <div class="modal-top">
      <div><h3 id="modalTitle"></h3></div>
      <span class="modal-price" id="modalPrice"></span>
    </div>
    <div class="modal-badges" id="modalBadges"></div>
    <p class="desc" id="modalDesc"></p>
    <div class="allergen-list" id="modalAllergenList"></div>
    <p class="note" id="modalAllergenNote"></p>
  </div>
</div>

<script>
  // ---------------- ICONE ALLERGENI (SVG minimali) ----------------
  const ALLERGENS = {
    glutine:   { label: "Glutine",        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v18M12 6c-2 0-3 1-3 2s1 1.5 3 1.5S15 10 15 11s-1 2-3 2m0 0c-2 0-3 1-3 2s1 1.5 3 1.5"/></svg>' },
    lattosio:  { label: "Lattosio",       svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h6l1 4-1 2v12a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V8L8 6z"/></svg>' },
    uova:      { label: "Uova",           svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="13" rx="6" ry="8"/></svg>' },
    pesce:     { label: "Pesce",          svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12c3-4 8-6 13-4 2 .8 4 2.3 5 4-1 1.7-3 3.2-5 4-5 2-10 0-13-4z"/><circle cx="15" cy="11" r="0.6" fill="currentColor"/><path d="M3 12l-2-3m2 3l-2 3"/></svg>' },
    crostacei: { label: "Crostacei",      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 14c0-5 3-9 7-9s5 3 4 6c-1 2-3 2-4 1M6 14c-2 1-3 3-2 5m2-5l3 2m-1-9L6 5m4 3L8 4"/></svg>' },
    molluschi: { label: "Molluschi",      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4c4 1 7 5 7 10 0 1-3 2-7 2s-7-1-7-2c0-5 3-9 7-10z"/><path d="M12 6v10M9 8v8M15 8v8"/></svg>' },
    frutta_guscio: { label: "Frutta a guscio", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3c4 0 6 4 6 9s-2 9-6 9-6-4-6-9 2-9 6-9z"/><path d="M12 3v18"/></svg>' },
    soia:      { label: "Soia",           svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="9" cy="9" rx="3" ry="4"/><ellipse cx="15" cy="15" rx="3" ry="4"/></svg>' },
    solfiti:   { label: "Solfiti",        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3h8M9 3v5l-4 8a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-4-8V3"/></svg>' }
  };

  const SOCIAL_ICONS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg>',
    facebook:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 8h-2a2 2 0 0 0-2 2v2H9v3h2v6h3v-6h2.2l.8-3H14v-1.5c0-.5.3-1 1-1h2z"/><circle cx="12" cy="12" r="9"/></svg>',
    whatsapp:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17l-1.5 3.5L9 19c1 .5 2 .8 3 .8 4.5 0 8-3.6 8-8s-3.5-8-8-8-8 3.6-8 8c0 1.6.5 3 1.3 4.2"/><path d="M9.5 9c0 3 2.5 5.5 5.5 5.5"/></svg>',
    website:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z"/></svg>'
  };

  let MENU_DATA = null;
  let activeCategory = 'Tutti';

  const menuContainer = document.getElementById('menuContainer');
  const tabsEl = document.getElementById('tabs');
  const searchInput = document.getElementById('searchInput');
  const emptyState = document.getElementById('emptyState');

  async function init(){
    try{
      const res = await fetch('data.json?t=' + Date.now());
      MENU_DATA = await res.json();
    }catch(e){
      document.getElementById('restaurantName').textContent = 'Errore nel caricamento del menu';
      return;
    }

    const r = MENU_DATA.restaurant || {};
    document.title = r.name || 'Menu Digitale';
    document.getElementById('restaurantName').textContent = r.name || '';
    document.getElementById('restaurantHours').textContent = r.hours || '';
    document.getElementById('restaurantAddress').textContent = r.address || '';
    document.getElementById('footerInfo').textContent = [r.name, r.address].filter(Boolean).join(' · ');

    if(r.logo){
      const logoImg = document.getElementById('logoImg');
      logoImg.src = r.logo;
      logoImg.style.display = 'inline-block';
    }
    if(r.background){
      document.body.style.backgroundImage = `linear-gradient(rgba(26,21,18,0.35), rgba(26,21,18,0.35)), url("${r.background}")`;
    }

    const socialRow = document.getElementById('socialRow');
    const social = r.social || {};
    ['instagram','facebook','whatsapp','website'].forEach(key => {
      if(social[key]){
        const a = document.createElement('a');
        a.href = social[key];
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = SOCIAL_ICONS[key];
        socialRow.appendChild(a);
      }
    });

    buildTabs();
    render();
  }

  function buildTabs(){
    const categories = ['Tutti', ...MENU_DATA.categories.map(c => c.name)];
    tabsEl.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat;
      btn.addEventListener('click', () => { activeCategory = cat; buildTabs(); render(); });
      tabsEl.appendChild(btn);
    });
  }

  function render(){
    const query = searchInput.value.trim().toLowerCase();
    menuContainer.innerHTML = '';
    let totalShown = 0;

    MENU_DATA.categories.forEach(catBlock => {
      if(activeCategory !== 'Tutti' && catBlock.name !== activeCategory) return;

      const filteredItems = catBlock.items.filter(item =>
        item.name.toLowerCase().includes(query) || (item.desc || '').toLowerCase().includes(query)
      );
      if(filteredItems.length === 0) return;
      totalShown += filteredItems.length;

      const section = document.createElement('section');
      section.className = 'category-block';
      const h2 = document.createElement('h2');
      h2.textContent = catBlock.name;
      section.appendChild(h2);

      filteredItems.forEach(item => {
        const dish = document.createElement('button');
        dish.className = 'dish';
        dish.setAttribute('type','button');

        if(item.image){
          const thumb = document.createElement('img');
          thumb.className = 'dish-thumb';
          thumb.src = item.image;
          thumb.alt = item.name;
          dish.appendChild(thumb);
        }

        const left = document.createElement('div');
        left.className = 'dish-left';
        const name = document.createElement('div');
        name.className = 'dish-name';
        name.textContent = item.name;
        left.appendChild(name);

        const tagsRow = document.createElement('div');
        tagsRow.className = 'dish-tags';
        (item.badges || []).forEach(b => {
          const span = document.createElement('span');
          span.className = 'badge';
          span.textContent = b === 'veg' ? 'Vegetariano' : b === 'spicy' ? 'Piccante' : b === 'gf' ? 'Senza glutine' : b;
          tagsRow.appendChild(span);
        });
        (item.allergenIcons || []).forEach(key => {
          if(!ALLERGENS[key]) return;
          const span = document.createElement('span');
          span.className = 'allergen-icon';
          span.title = ALLERGENS[key].label;
          span.innerHTML = ALLERGENS[key].svg;
          tagsRow.appendChild(span);
        });
        if(tagsRow.children.length) left.appendChild(tagsRow);

        const price = document.createElement('div');
        price.className = 'dish-price';
        price.textContent = '€ ' + Number(item.price || 0).toFixed(2);

        dish.appendChild(left);
        dish.appendChild(price);
        dish.addEventListener('click', () => openModal(item));
        section.appendChild(dish);
      });

      menuContainer.appendChild(section);
    });

    emptyState.classList.toggle('show', totalShown === 0);
  }

  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const modalPrice = document.getElementById('modalPrice');
  const modalDesc = document.getElementById('modalDesc');
  const modalBadges = document.getElementById('modalBadges');
  const modalAllergenList = document.getElementById('modalAllergenList');
  const modalAllergenNote = document.getElementById('modalAllergenNote');
  const modalImg = document.getElementById('modalImg');
  const modalCloseBtn = document.getElementById('modalCloseBtn');

  function openModal(item){
    modalTitle.textContent = item.name;
    modalPrice.textContent = '€ ' + Number(item.price || 0).toFixed(2);
    modalDesc.textContent = item.desc || '';
    modalBadges.innerHTML = '';
    (item.badges || []).forEach(b => {
      const span = document.createElement('span');
      span.className = 'badge';
      span.textContent = b === 'veg' ? 'Vegetariano' : b === 'spicy' ? 'Piccante' : b === 'gf' ? 'Senza glutine' : b;
      modalBadges.appendChild(span);
    });
    modalAllergenList.innerHTML = '';
    (item.allergenIcons || []).forEach(key => {
      if(!ALLERGENS[key]) return;
      const div = document.createElement('div');
      div.className = 'allergen-item';
      div.innerHTML = ALLERGENS[key].svg + '<span>' + ALLERGENS[key].label + '</span>';
      modalAllergenList.appendChild(div);
    });
    modalAllergenNote.textContent = item.allergens || '';
    if(item.image){ modalImg.src = item.image; modalImg.style.display = 'block'; }
    else{ modalImg.style.display = 'none'; }
    modalBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){ modalBackdrop.classList.remove('open'); document.body.style.overflow = ''; }
  modalCloseBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
  searchInput.addEventListener('input', render);

  init();
</script>
</body>
</html>
